<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>案例查看 · UI案例拆解学习</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='8' height='8' rx='2' fill='%233b6ea5'/%3E%3Crect x='13' y='3' width='8' height='8' rx='2' fill='%236a93c4'/%3E%3Crect x='3' y='13' width='8' height='8' rx='2' fill='%236a93c4'/%3E%3Crect x='13' y='13' width='8' height='8' rx='2' fill='%233b6ea5'/%3E%3C/svg%3E" />
  <script src="assets/js/tailwind.local.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f2f6fc', 100: '#e6eff9', 200: '#cfdff2', 400: '#6a93c4', 500: '#3b6ea5', 600: '#325d8c' },
            ink: { 400: '#93a0ad', 500: '#6b7785', 700: '#46525f', 900: '#1f2733' }
          },
          boxShadow: { card: '0 1px 2px rgba(24,39,60,.06)', lift: '0 6px 20px rgba(24,39,60,.08)' }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/library.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <div class="view-head">
        <div class="min-w-0">
          <h1 id="viewTitle"></h1>
          <div id="viewTags" class="flex flex-wrap gap-1.5 mb-2"></div>
          <div id="viewMeta" class="text-[12px] text-ink-500"></div>
        </div>
        <div class="view-actions">
          <div id="mainActions" class="main-actions"></div>
          <button id="btnFav" class="fav-btn"></button>
        </div>
      </div>

      <div class="view-layout">
        <!-- 左：图片 -->
        <div class="view-left">
          <img id="mainImg" class="main-img" alt="案例主图" />
          <div id="miniAlbum" class="view-mini"></div>
          <div class="card card-pad" id="annCard">
            <div class="section-title mb-2" id="annTitle"></div>
            <div id="annList" class="view-ann-list"></div>
          </div>
        </div>

        <!-- 右：详细内容铺开（空内容整块不渲染） -->
        <div class="view-right">
          <div id="aiSections"></div>
          <div id="manualSections"></div>
          <details class="view-raw" id="rawDetails">
            <summary id="rawSummary"></summary>
            <pre id="rawContent"></pre>
          </details>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/view.js"></script>
</body>
</html>
