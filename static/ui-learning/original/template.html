<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提示词模板 · UI案例拆解学习</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='8' height='8' rx='2' fill='%233b6ea5'/%3E%3Crect x='13' y='3' width='8' height='8' rx='2' fill='%236a93c4'/%3E%3Crect x='3' y='13' width='8' height='8' rx='2' fill='%236a93c4'/%3E%3Crect x='13' y='13' width='8' height='8' rx='2' fill='%233b6ea5'/%3E%3C/svg%3E" />
  <script src="assets/js/tailwind.local.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f2f6fc', 100: '#e6eff9', 200: '#cfdff2', 400: '#6a93c4', 500: '#3b6ea5', 600: '#325d8c' },
            ink: { 400: '#93a0ad', 500: '#6b7785', 700: '#46525f', 900: '#1f2733' }
          },
          boxShadow: { card: '0 1px 2px rgba(24,39,60,.06)', lift: '0 6px 20px rgba(24,39,60,.08)' }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/library.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <div class="flex items-center justify-between gap-3 flex-wrap mb-5">
        <h1 class="text-lg font-bold text-ink-900">提示词模板管理</h1>
        <div id="mainActions" class="main-actions"></div>
      </div>
      <div class="max-w-[1100px] w-full mx-auto space-y-5">
        <div class="grid lg:grid-cols-[280px_1fr] gap-5 items-start">
          <section class="card card-pad">
            <div class="flex items-center justify-between mb-3">
              <span class="section-title" id="tplListTitle"></span>
              <button id="btnNewTpl" class="btn btn-quiet btn-sm"></button>
            </div>
            <div id="activeTplName" class="text-[12px] text-ink-500 mb-3"></div>
            <div id="tplList" class="space-y-2"></div>
          </section>

          <section class="card card-pad">
            <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
              <span class="section-title" id="editTitle"></span>
              <div class="flex gap-2">
                <button id="btnSetActive" class="btn btn-quiet btn-sm"></button>
                <button id="btnDeleteTpl" class="btn btn-ghost btn-sm"></button>
              </div>
            </div>

            <div class="grid sm:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="field-label" id="nameLabel"></label>
                <input id="editName" class="input" />
              </div>
              <div>
                <label class="field-label" id="typeLabel"></label>
                <select id="editType" class="input">
                  <option value="B">B 端</option>
                  <option value="C">C 端</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="field-label" id="descLabel"></label>
              <input id="editDesc" class="input" />
            </div>

            <div class="mb-4">
              <label class="field-label" id="systemLabel"></label>
              <textarea id="editSystem" class="textarea" rows="11" style="min-height:200px"></textarea>
            </div>

            <div class="mb-4">
              <label class="field-label" id="userLabel"></label>
              <textarea id="editUser" class="textarea" rows="3"></textarea>
            </div>

            <button id="btnSaveTpl" class="btn btn-primary w-full"></button>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/template.js"></script>
</body>
</html>
