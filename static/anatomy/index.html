<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医学级 3D 骨骼模型</title><style>html,body{margin:0;height:100%;background:#07111b;color:#dce9f5;font:14px system-ui}main{height:100%;display:grid;place-content:center;text-align:center;padding:24px;box-sizing:border-box}h2{color:#a8ef72}p{max-width:500px;line-height:1.8;color:#9bb0c5}code{color:#b9f18a;background:#142535;padding:4px 8px;border-radius:5px}</style><main><h2>BodyParts3D 医学级骨骼网格尚未安装</h2><p>为遵守原始模型许可并避免把不完整模型伪装成医学级资产，请在项目根目录执行一次安装脚本。它会将授权骨骼网格、Three.js、OBJLoader 与轨道控制器下载到本地目录。之后此模型从本机加载。</p><p><code>python scripts/setup_anatomy_assets.py</code></p><p>安装成功后刷新本页面即可。下载需要首次联网；模型查看与动作 GIF 在安装后可离线使用。</p></main></html>
